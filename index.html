<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dados Prototipo Flexible Total</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #2c3e50; color: white; margin: 0; text-align: center; }
        .pantalla { display: none; padding: 15px; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .activa { display: flex !important; }

        /* Menú Principal */
        input { padding: 15px; font-size: 20px; width: 65px; border-radius: 10px; border: none; margin: 15px; text-align: center; background: white; color: #333; }
        .btn-lanzar { padding: 20px 45px; font-size: 22px; background: #27ae60; border: none; color: white; border-radius: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #1e8449; }
        .btn-lanzar:active { transform: translateY(2px); box-shadow: 0 2px #1e8449; }

        /* Pantalla de Juego */
        .zona-lanzamiento { width: 100%; min-height: 110px; background: rgba(255,255,255,0.08); border-radius: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 10px; margin-bottom: 15px; border: 1px dashed rgba(255,255,255,0.3); }
        .tablero { display: flex; gap: 6px; width: 100%; height: 52vh; }
        .columna { flex: 1; border-radius: 10px; background: rgba(0,0,0,0.25); border: 1.5px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .tit { font-size: 10px; padding: 10px 2px; margin: 0; font-weight: bold; text-transform: uppercase; }
        .sub { font-size: 8px; opacity: 0.7; padding-bottom: 5px; background: inherit; }
        .lista { flex: 1; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

        /* Dados y Botones */
        .dado-caja { display: flex; flex-direction: column; align-items: center; animation: aparecer 0.3s ease-out; }
        @keyframes aparecer { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
        
        .dado { width: 48px; height: 48px; background: white; color: #333; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; border-radius: 10px; box-shadow: 0 4px rgba(0,0,0,0.2); cursor: pointer; }
        .btns { display: flex; gap: 3px; margin-top: 6px; }
        .btn-a { padding: 6px 4px; font-size: 9px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }

        .btn-turno { margin-top: 15px; padding: 18px; background: #e67e22; border: none; color: white; border-radius: 12px; font-weight: bold; width: 100%; font-size: 16px; box-shadow: 0 4px #d35400; }
        .info-res { color: #f1c40f; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="p-inicio" class="pantalla activa">
        <h1>Lanzar Dados</h1>
        <div id="msg-res" class="info-res"></div>
        <p>Total de dados para este turno:</p>
        <input type="number" id="num-dados" value="3" inputmode="numeric">
        <button class="btn-lanzar" onclick="ejecutarLanzamiento()">LANZAR</button>
    </div>

    <div id="p-juego" class="pantalla">
        <div id="zona-libres" class="zona-lanzamiento"></div>
        <div class="tablero">
            <div class="columna" style="border-color:#3498db">
                <p class="tit" style="background:#3498db">Movimiento</p>
                <span class="sub" style="background:#3498db">Toca p/quitar</span>
                <div id="l-mov" class="lista"></div>
            </div>
            <div class="columna" style="border-color:#e74c3c">
                <p class="tit" style="background:#e74c3c">Acción</p>
                <span class="sub" style="background:#e74c3c">Toca p/quitar</span>
                <div id="l-acc" class="lista"></div>
            </div>
            <div class="columna" style="border-color:#f1c40f">
                <p class="tit" style="background:#f1c40f; color:#333">Reserva</p>
                <span class="sub" style="background:#f1c40f; color:#333">Toca p/quitar</span>
                <div id="l-res" class="lista"></div>
            </div>
        </div>
        <button class="btn-turno" onclick="nuevoTurno()">TERMINAR TURNO</button>
    </div>

    <script>
        function ejecutarLanzamiento() {
            const total = parseInt(document.getElementById('num-dados').value) || 0;
            const enReserva = document.querySelectorAll('#l-res .dado-caja').length;
            const necesarios = total - enReserva;

            if (necesarios <= 0 && total > 0) {
                alert("La reserva ya tiene " + enReserva + " dados. Sube el total para lanzar nuevos.");
                return;
            }

            document.getElementById('p-inicio').classList.remove('activa');
            document.getElementById('p-juego').classList.add('activa');

            for(let i=0; i < necesarios; i++) {
                crearDado(Math.floor(Math.random()*6)+1);
            }
        }

        function crearDado(valor) {
            const caja = document.createElement('div');
            caja.className = 'dado-caja';
            caja.innerHTML = `
                <div class="dado" style="background:white; color:#333">${valor}</div>
                <div class="btns">
                    <button class="btn-a" style="background:#3498db" onclick="mover(this,'mov')">MOV</button>
                    <button class="btn-a" style="background:#e74c3c" onclick="mover(this,'acc')">ACC</button>
                    <button class="btn-a" style="background:#f1c40f;color:#333" onclick="mover(this,'res')">RES</button>
                </div>`;
            document.getElementById('zona-libres').appendChild(caja);
        }

        function mover(btn, cat) {
            const caja = btn.parentElement.parentElement;
            const dado = caja.querySelector('.dado');
            const valor = dado.innerText;
            
            const colores = {mov:'#3498db', acc:'#e74c3c', res:'#f1c40f'};
            dado.style.background = colores[cat];
            dado.style.color = (cat === 'res') ? '#2c3e50' : 'white';
            
            // Ocultar botones de asignación
            caja.querySelector('.btns').style.display = 'none';

            // HACER QUE CUALQUIER DADO SEA REASIGNABLE
            dado.onclick = function() {
                caja.remove(); // Se va de la columna
                crearDado(valor); // Vuelve arriba con sus botones
            };

            document.getElementById('l-' + cat).appendChild(caja);
        }

        function nuevoTurno() {
            // Borramos Movimiento y Acción, mantenemos Reserva
            document.getElementById('l-mov').innerHTML = '';
            document.getElementById('l-acc').innerHTML = '';
            document.getElementById('zona-libres').innerHTML = '';
            
            document.getElementById('p-juego').classList.remove('activa');
            document.getElementById('p-inicio').classList.add('activa');

            const resActual = document.querySelectorAll('#l-res .dado-caja').length;
            document.getElementById('msg-res').innerText = resActual > 0 ? "Dados en reserva: " + resActual : "";
        }
    </script>
</body>
</html>
